timezone: Europe/Zurich
language_default: en

baby:
  birthdate: 2026-01-05
  creche:
    days: [Mon, Tue, Thu, Fri]
    location: { postcode: 8400, city: Winterthur, lat: 47.4979, lon: 8.7240 }
    drop_off: "08:00"
    pick_up: "16:15"
    midday_alert_window: ["09:00", "16:00"]
    rain_snow_threshold_pct: 40

workouts:
  cycling:
    times: ["06:30", "16:30"]
    location: { postcode: 8001, city: Zurich, lat: 47.3769, lon: 8.5417 }
    clothing_table: cycling_clothing.yaml
    wet_threshold_pct: 30
  running:
    times: ["07:00"]
    location: { postcode: 8400, city: Winterthur, lat: 47.4979, lon: 8.7240 }
    clothing_table: running_clothing.yaml
    wet_threshold_pct: 30
  swimming:
    times: ["07:00"]
    location: { postcode: 8800, city: Thalwil, lat: 47.2920, lon: 8.5633 }
    lake: zurich
    min_water_temp_to_show_c: 10

cloud_cover_labels:
  Sunny:           [0,  20]
  Partially sunny: [21, 50]
  Mostly cloudy:   [51, 80]
  Overcast:        [81, 100]

# --- ADD THIS BLOCK to config.yaml (after cloud_cover_labels, before stocks) ---
 
diff_thresholds:
  temp_c:       0.5   # °C  — annotate temp changes ≥ 0.5 °C
  rain_pct:     5     # %   — annotate rain-prob changes ≥ 5 pp
  wind_ms:      1.0   # m/s — annotate wind changes ≥ 1 m/s
  water_temp_c: 0.5   # °C  — annotate lake temp changes ≥ 0.5 °C
 
alerts:
  meteoswiss:
    # Unofficial MeteoSwiss app backend — per-postcode warnings.
    # Endpoint: https://app-prod-ws.meteoswiss-app.ch/v1/plzDetail?plz=XXXX00
    # Postcode comes from the block's own location (cycling → 8001, running → 8400).
    # Only icing/frost/snow types (4, 5, 6) are extracted — see fetchers/alerts.py.
    severity_min: 2   # 1=no danger, 2=moderate, 3=considerable, 4=high, 5=very high
                      # MeteoSwiss only issues public warnings from level 2 upward.
 
  # Rain threshold for workout blocks (cycling/running).
  # If rain_pct at the workout slot is ≥ this value, an alert line is added.
  # Baby midday alerts use baby.creche.rain_snow_threshold_pct (already in config).
  workout_rain_threshold_pct: 40

stocks:
  - ticker: KRU
    exchange: WSE
    shares_secret: STOCKS_KRU_SHARES
    currency: PLN

wednesday_event:
  # Outdoor evening event — every Wednesday June–September, 18:00–22:00.
  # Block appears in: Tuesday evening briefing + Wednesday morning update.
  # Location: Zurich 8001 (same as cycling).
  location: { postcode: 8001, city: Zurich, lat: 47.3769, lon: 8.5417 }


holiday:
  # Holiday mode (Phase 14). For every digest whose TARGET date falls inside a
  # period below (start/end inclusive), the normal baby / cycling / running /
  # swimming blocks are switched off and replaced by holiday blocks for the
  # period's location: one shared weather table, baby clothing (LLM), running
  # clothing per slot, and water temperature if `swimming` is given.
  # Stocks and wednesday_event are unaffected. Dispatch times are unchanged.
  #
  # Matching is on the TARGET date: the 20:00 run builds the next day, so the
  # evening before a period starts is already in holiday mode.
  # slot_times / alert_window are LOCAL time at the holiday location (the
  # period's IANA timezone is passed to Open-Meteo). Keep times quoted: YAML
  # reads an unquoted 06:00 as the number 360.
  # Outside all periods the agent runs normally, so finished periods can stay.
  slot_times: ["06:00", "09:00", "12:00", "15:00", "18:00", "21:00"]
  alert_window: ["06:00", "21:00"]
  rain_alert_threshold_pct: 40
  periods:
    - start: 2026-10-04
      end:   2026-10-09
      location: { city: Wrocław, country: PL, lat: 51.1079, lon: 17.0385, timezone: Europe/Warsaw }
    - start: 2026-10-10
      end:   2026-10-17
      location: { city: Tigaki, country: GR, lat: 36.8904, lon: 27.1823, timezone: Europe/Athens }
      # Sea temperature point just off Tigaki beach (Open-Meteo Marine API).
      swimming: { name: Tigaki beach, water: sea, lat: 36.9000, lon: 27.1823 }
    - start: 2026-10-18
      end:   2026-10-21
      location: { city: Wrocław, country: PL, lat: 51.1079, lon: 17.0385, timezone: Europe/Warsaw }

recipients:
  - name: Pawel
    role: full
    language: en
    channels:
      - type: email
        address_secret: RECIPIENT_PAWEL_EMAIL
      - type: telegram
        chat_id_secret: RECIPIENT_PAWEL_TELEGRAM
  - name: Liliana
    role: baby_only
    language: en
    channels:
      - type: email
        address_secret: RECIPIENT_LILIANA_EMAIL
      - type: telegram                                   # ← add this
        chat_id_secret: RECIPIENT_LILIANA_TELEGRAM       # ← and this